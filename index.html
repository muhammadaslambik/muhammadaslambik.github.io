<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammad Aslambik — AI Automation Engineer</title>
<meta name="description" content="Muhammad Aslambik — AI Automation Engineer. Merancang workflow n8n dengan integrasi AI Agent untuk proses bisnis.">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--bg:#0B0D10;
--surface:#12151A;
--surface-2:#181C22;
--border:#242931;
--text:#F0EDE6;
--muted:#8B9198;
--muted-2:#5B6169;
--amber:#FFB454;
--amber-dim:#8a6229;
--teal:#5EEAD4;
--red:#F0876B;
--radius:10px;
--display: 'Space Grotesk', sans-serif;
--body: 'Inter', sans-serif;
--mono: 'JetBrains Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
body{
background:var(--bg);
color:var(--text);
font-family:var(--body);
line-height:1.6;
overflow-x:hidden;
}
body.menu-open {
overflow: hidden;
}
body::before{
content:"";
position:fixed; inset:0;
background-image:
linear-gradient(var(--border) 1px, transparent 1px),
linear-gradient(90deg, var(--border) 1px, transparent 1px);
background-size:64px 64px;
opacity:.18;
pointer-events:none;
z-index:0;
}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block;}
section{position:relative; z-index:1;}
.wrap{max-width:1120px; margin:0 auto; padding:0 24px;}
::selection{background:var(--amber); color:#0B0D10;}
[data-i18n]{display:none;}
html[data-lang="id"] [data-i18n="id"]{display:revert;}
html[data-lang="en"] [data-i18n="en"]{display:revert;}
span[data-i18n], strong[data-i18n]{display:none;}
html[data-lang="id"] span[data-i18n="id"], html[data-lang="id"] strong[data-i18n="id"]{display:inline;}
html[data-lang="en"] span[data-i18n="en"], html[data-lang="en"] strong[data-i18n="en"]{display:inline;}

/* NAV */
header{
position:fixed; top:0; left:0; right:0; z-index:50;
background:rgba(11,13,16,.78);
backdrop-filter:blur(10px);
border-bottom:1px solid var(--border);
}
nav.wrap{
display:flex; align-items:center; justify-content:space-between;
height:72px;
}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:.01em; z-index: 60;}
.brand .mark{
width:34px; height:34px; border-radius:8px;
background:linear-gradient(135deg, var(--amber), var(--red));
display:flex; align-items:center; justify-content:center;
color:#0B0D10; font-family:var(--mono); font-weight:700; font-size:13px;
}
.navlinks{display:flex; align-items:center; gap:36px;}
.navlinks a{
font-family:var(--mono); font-size:13px; color:var(--muted);
text-transform:uppercase; letter-spacing:.06em;
transition:color .2s;
position:relative;
padding-bottom:4px;
}
.navlinks a:hover{color:var(--text);}
.navlinks a.active{color:var(--amber);}
.navlinks a.active::after{
content:"";
position:absolute; left:0; right:0; bottom:-1px;
height:2px; border-radius:2px;
background:var(--amber);
box-shadow:0 0 8px rgba(255,180,84,.6);
}
.navright{display:flex; align-items:center; gap:18px;}
.status-pill{
display:flex; align-items:center; gap:7px;
font-family:var(--mono); font-size:12px; color:var(--teal);
border:1px solid rgba(94,234,212,.3); background:rgba(94,234,212,.06);
padding:6px 12px; border-radius:100px;
}
.status-pill .dot{width:6px; height:6px; border-radius:50%; background:var(--teal); box-shadow:0 0 8px var(--teal); animation:pulse 1.8s infinite;}
@keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}
.lang-toggle{
display:flex; font-family:var(--mono); font-size:12px; border:1px solid var(--border); border-radius:100px; overflow:hidden;
}
.lang-toggle button{
background:none; border:none; color:var(--muted); padding:6px 12px; cursor:pointer; font-family:var(--mono); font-size:12px;
}
.lang-toggle button.active{background:var(--amber); color:#0B0D10; font-weight:600;}
.btn{
font-family:var(--mono); font-size:13px; font-weight:500;
padding:10px 18px; border-radius:8px; border:1px solid var(--amber);
color:#0B0D10; background:var(--amber);
cursor:pointer; transition:transform .15s, box-shadow .15s;
display:inline-block;
}
.btn:hover{transform:translateY(-1px); box-shadow:0 6px 20px rgba(255,180,84,.25);}
.btn-ghost{background:none; color:var(--text); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--amber); box-shadow:none;}

/* NEW STYLING: EMAIL & SOCIAL LOGO */
.email-link-wrapper {
display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; color: var(--muted); transition: color 0.2s; margin-bottom: 4px;
}
.email-link-wrapper:hover { color: var(--text); }
.email-link-wrapper svg { width: 16px; height: 16px; fill: currentColor; color: var(--amber); }

.social-icons-group { display: flex; align-items: center; gap: 16px; }
.social-icon-link { color: var(--muted); transition: color 0.2s, transform 0.2s; display: flex; align-items: center; justify-content: center; }
.social-icon-link:hover { color: var(--amber); transform: translateY(-1px); }
.social-icon-link svg { width: 22px; height: 22px; fill: currentColor; }

/* HAMBURGER BUTTON COMPONENT */
.navmenu-toggle{
display:none; background:none; border:none; color:var(--text); cursor:pointer;
z-index: 60; width: 40px; height: 40px; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
}
.navmenu-toggle span {
display: block; width: 24px; height: 2px; background: var(--text); border-radius: 2px; transition: transform .3s, opacity .3s, background-color .3s;
}
.navmenu-toggle.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); background: var(--amber); }
.navmenu-toggle.active span:nth-child(2) { opacity: 0; }
.navmenu-toggle.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); background: var(--amber); }

/* MOBILE OVERLAY NAVIGATION */
.mobile-menu-overlay {
position: fixed; inset: 0; background: rgba(11, 13, 16, 0.97); backdrop-filter: blur(16px);
z-index: 55; display: flex; flex-direction: column; padding: 120px 32px 40px;
transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; pointer-events: none;
}
.mobile-menu-overlay.open { transform: translateX(0); opacity: 1; pointer-events: auto; }
.mobile-navlinks { display: flex; flex-direction: column; gap: 24px; margin-bottom: auto; }
.mobile-navlinks a { font-family: var(--display); font-size: 32px; font-weight: 700; color: var(--muted); transition: color 0.2s; }
.mobile-navlinks a:hover, .mobile-navlinks a.active { color: var(--amber); }
.mobile-menu-overlay .mobile-bottom-wrap { display: flex; flex-direction: column; gap: 24px; margin-top: auto; padding-top: 24px; border-top: 1px solid var(--border); }
.mobile-action-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }

@media (max-width: 992px) {
.navlinks, .navright { display: none; }
.navmenu-toggle { display: flex; }
}

/* HERO */
.hero{padding:168px 0 100px; position:relative;}
.eyebrow{
font-family:var(--mono); font-size:12px; color:var(--muted-2);
letter-spacing:.14em; text-transform:uppercase; margin-bottom:20px;
display:flex; align-items:center; gap:10px;
}
.eyebrow::before{content:""; width:22px; height:1px; background:var(--muted-2);}
h1.headline{
font-family:var(--display); font-weight:700;
font-size:clamp(38px, 6.2vw, 74px);
line-height:1.04; letter-spacing:-.02em; margin-bottom:26px;
max-width:820px;
}
h1.headline .accent{color:var(--amber);}
.lede{ font-size:18px; color:var(--muted); max-width:560px; margin-bottom:38px; }
.hero-cta{display:flex; gap:14px; margin-bottom:80px; flex-wrap:wrap;}

/* Workflow diagram */
.flow-card{ border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); overflow:hidden; }
.flow-topbar{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1px solid var(--border); font-family:var(--mono); font-size:12px; color:var(--muted); }
.flow-topbar .live{color:var(--teal); display:flex; align-items:center; gap:6px;}
.flow-topbar .live .dot{width:6px;height:6px;border-radius:50%;background:var(--teal); animation:pulse 1.8s infinite;}
.flow-canvas{padding:34px 18px; overflow-x:auto;}
.flow-canvas svg{width:100%; height:auto; min-width:640px;}
.flow-node-label{font-family:var(--mono); font-size:11px; fill:var(--muted);}
.flow-node-title{font-family:var(--display); font-size:13px; font-weight:600; fill:var(--text);}

/* SECTION HEADERS */
.sec-eyebrow{ font-family:var(--mono); font-size:12px; color:var(--amber); letter-spacing:.1em; margin-bottom:14px; }
h2.sec-title{ font-family:var(--display); font-weight:600; font-size:clamp(26px, 3.6vw, 40px); letter-spacing:-.01em; max-width:640px; margin-bottom:16px; }
.sec-sub{color:var(--muted); max-width:520px; font-size:15px; margin-bottom:56px;}

/* ABOUT */
#about{padding:110px 0;}
.about-grid{display:grid; grid-template-columns:1.3fr .9fr; gap:64px; align-items:start;}
.about-grid p{color:var(--muted); font-size:16px; margin-bottom:20px;}
.about-grid strong{color:var(--text); font-weight:600;}
.facts{border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);}
.fact-row{ display:flex; justify-content:space-between; align-items:center; padding:18px 20px; border-bottom:1px solid var(--border); font-size:13px; }
.fact-row:last-child{border-bottom:none;}
.fact-row .k{font-family:var(--mono); color:var(--muted-2); text-transform:uppercase; letter-spacing:.06em; font-size:11px;}
.fact-row .v{font-weight:500; text-align:right;}
.fact-row .v.status{color:var(--teal); display:flex; align-items:center; gap:6px;}
.fact-row .v.status .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);}

/* SKILLS */
